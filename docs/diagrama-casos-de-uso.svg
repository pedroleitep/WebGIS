<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 1200" width="1400" height="1200" role="img"
        aria-label="Diagrama UML de casos de uso do sistema GeoSaúde BH">
    <style>
  text{ font-family:"Segoe UI",Helvetica,Arial,sans-serif }
  .d-boundary{ fill:none; stroke:#7d949e; stroke-width:1.3 }
  .d-boundary-bg{ fill:#f4f7f7 }
  .d-title{ fill:#0d1b24; font-family:"Bahnschrift","DIN Alternate",sans-serif;
            font-size:13px; letter-spacing:.11em; text-anchor:middle; font-weight:600 }
  .d-uc{ fill:#ffffff; stroke:#4d6773; stroke-width:1.2 }
  .d-uc--core{ fill:#d3ecee; stroke:#06707c; stroke-width:1.7 }
  .d-t{ fill:#0d1b24; font-size:11px; text-anchor:middle }
  .d-t--sm{ font-size:10px }
  .d-t--it{ font-style:italic; fill:#4d6773; font-size:9.5px }
  .d-actor{ fill:none; stroke:#0d1b24; stroke-width:1.5; stroke-linecap:round }
  .d-actor-t{ fill:#0d1b24; font-size:11px; font-weight:600; text-anchor:middle }
  .d-assoc{ stroke:#4d6773; stroke-width:1.2; fill:none }
  .d-dash{ stroke:#4d6773; stroke-width:1.2; stroke-dasharray:6 4; fill:none }
  .d-gen{ stroke:#4d6773; stroke-width:1.2; fill:none }
  .d-stereo{ fill:#4d6773; font-family:Consolas,"Courier New",monospace;
             font-size:9px; text-anchor:middle }
  .d-legend{ fill:#ffffff; stroke:#d3dee1; stroke-width:1 }
</style>
    <rect x="0" y="0" width="1400" height="1200" fill="#ffffff"/>
    <defs>
      <marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
        <path d="M1,1 L9,5 L1,9" fill="none" stroke="#4d6773" stroke-width="1.3"
              stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="tri" markerWidth="13" markerHeight="13" refX="12" refY="6.5" orient="auto">
        <path d="M1,1 L12,6.5 L1,12 z" fill="#ffffff" stroke="#4d6773"
              stroke-width="1.3" stroke-linejoin="round"/>
      </marker>
    </defs>

    <!-- ===== fronteira do sistema ===== -->
    <rect x="300" y="60" width="880" height="1020" rx="6" class="d-boundary-bg"/>
    <rect x="300" y="60" width="880" height="1020" rx="6" class="d-boundary"/>
    <text x="740" y="94" class="d-title">Sistema WebGIS GeoSaúde BH</text>
    <line x1="300" y1="112" x2="1180" y2="112" stroke="#d3dee1" stroke-width="1"/>

    <!-- ===== atores ===== -->
    <!-- Familiar do Paciente -->
    <g class="d-actor">
      <circle cx="110" cy="145" r="9" fill="#ffffff"/>
      <path d="M110 154v23M96 165h28M110 177l-11 18M110 177l11 18"/>
    </g>
    <text class="d-actor-t" x="110" y="112">Familiar do</text>
    <text class="d-actor-t" x="110" y="126">Paciente</text>

    <!-- Usuário do Sistema (abstrato) -->
    <g class="d-actor">
      <circle cx="110" cy="385" r="9" fill="#ffffff"/>
      <path d="M110 394v23M96 405h28M110 417l-11 18M110 417l11 18"/>
    </g>
    <text class="d-stereo" x="134" y="452" text-anchor="start">«abstract»</text>
    <text class="d-actor-t" x="134" y="468" text-anchor="start">Usuário do Sistema</text>

    <!-- Médico -->
    <g class="d-actor">
      <circle cx="110" cy="665" r="9" fill="#ffffff"/>
      <path d="M110 674v23M96 685h28M110 697l-11 18M110 697l11 18"/>
    </g>
    <text class="d-actor-t" x="110" y="746">Médico</text>

    <!-- Administrador de Dados -->
    <g class="d-actor">
      <circle cx="1290" cy="965" r="9" fill="#ffffff"/>
      <path d="M1290 974v23M1276 985h28M1290 997l-11 18M1290 997l11 18"/>
    </g>
    <text class="d-actor-t" x="1290" y="1046">Administrador</text>
    <text class="d-actor-t" x="1290" y="1060">de Dados</text>

    <!-- Provedor de Geodados (ator secundário / sistema externo) -->
    <g class="d-actor">
      <circle cx="700" cy="1105" r="9" fill="#ffffff"/>
      <path d="M700 1114v23M686 1125h28M700 1137l-11 18M700 1137l11 18"/>
    </g>
    <text class="d-stereo" x="700" y="1094">«system»</text>
    <text class="d-actor-t" x="700" y="1186">Provedor de Geodados</text>

    <!-- ===== generalização de atores ===== -->
    <line class="d-gen" x1="110" y1="208" x2="110" y2="360" marker-end="url(#tri)"/>
    <line class="d-gen" x1="110" y1="640" x2="110" y2="452" marker-end="url(#tri)"/>

    <!-- ===== casos de uso · coluna A (núcleo) ===== -->
    <ellipse cx="430" cy="160" rx="105" ry="36" class="d-uc d-uc--core"/>
    <text class="d-stereo" x="430" y="141">UC02</text>
    <text class="d-t" x="430" y="161">Localizar farmácias</text>
    <text class="d-t" x="430" y="176">próximas</text>

    <ellipse cx="430" cy="400" rx="105" ry="36" class="d-uc d-uc--core"/>
    <text class="d-stereo" x="430" y="378">UC01</text>
    <text class="d-t" x="430" y="396">Localizar serviços de</text>
    <text class="d-t" x="430" y="411">saúde próximos</text>
    <text class="d-t d-t--it" x="430" y="425">{abstract}</text>

    <ellipse cx="430" cy="660" rx="105" ry="36" class="d-uc d-uc--core"/>
    <text class="d-stereo" x="430" y="639">UC03</text>
    <text class="d-t d-t--sm" x="430" y="658">Localizar laboratórios de</text>
    <text class="d-t d-t--sm" x="430" y="673">radiografia próximos</text>

    <!-- generalização de casos de uso -->
    <line class="d-gen" x1="430" y1="196" x2="430" y2="352" marker-end="url(#tri)"/>
    <line class="d-gen" x1="430" y1="624" x2="430" y2="448" marker-end="url(#tri)"/>

    <!-- ===== casos de uso · coluna B (incluídos) ===== -->
    <ellipse cx="700" cy="150" rx="105" ry="36" class="d-uc"/>
    <text class="d-stereo" x="700" y="131">UC04</text>
    <text class="d-t" x="700" y="151">Selecionar hospital</text>
    <text class="d-t" x="700" y="166">de referência</text>

    <ellipse cx="700" cy="254" rx="105" ry="36" class="d-uc"/>
    <text class="d-stereo" x="700" y="248">UC05</text>
    <text class="d-t" x="700" y="266">Definir raio de busca</text>

    <ellipse cx="700" cy="358" rx="105" ry="36" class="d-uc"/>
    <text class="d-stereo" x="700" y="339">UC06</text>
    <text class="d-t" x="700" y="359">Filtrar por categoria</text>
    <text class="d-t" x="700" y="374">e atributos</text>

    <ellipse cx="700" cy="462" rx="105" ry="36" class="d-uc"/>
    <text class="d-stereo" x="700" y="443">UC07</text>
    <text class="d-t" x="700" y="463">Executar consulta</text>
    <text class="d-t" x="700" y="478">espacial</text>

    <ellipse cx="700" cy="566" rx="105" ry="36" class="d-uc"/>
    <text class="d-stereo" x="700" y="547">UC08</text>
    <text class="d-t" x="700" y="567">Listar resultados por</text>
    <text class="d-t" x="700" y="582">proximidade</text>

    <ellipse cx="700" cy="670" rx="105" ry="36" class="d-uc"/>
    <text class="d-stereo" x="700" y="651">UC09</text>
    <text class="d-t" x="700" y="671">Visualizar resultados</text>
    <text class="d-t" x="700" y="686">no mapa</text>

    <ellipse cx="700" cy="1000" rx="105" ry="36" class="d-uc"/>
    <text class="d-stereo" x="700" y="981">UC10</text>
    <text class="d-t" x="700" y="1001">Carregar base</text>
    <text class="d-t" x="700" y="1016">cartográfica</text>

    <!-- ===== casos de uso · coluna C (extensões + admin) ===== -->
    <ellipse cx="980" cy="462" rx="105" ry="36" class="d-uc"/>
    <text class="d-stereo" x="980" y="456">UC13</text>
    <text class="d-t" x="980" y="474">Exportar resultados</text>

    <ellipse cx="980" cy="566" rx="105" ry="36" class="d-uc"/>
    <text class="d-stereo" x="980" y="547">UC11</text>
    <text class="d-t" x="980" y="567">Ordenar resultados</text>
    <text class="d-t" x="980" y="582">alfabeticamente</text>

    <ellipse cx="980" cy="670" rx="105" ry="36" class="d-uc"/>
    <text class="d-stereo" x="980" y="651">UC12</text>
    <text class="d-t" x="980" y="671">Ver detalhes do</text>
    <text class="d-t" x="980" y="686">estabelecimento</text>

    <ellipse cx="980" cy="774" rx="105" ry="36" class="d-uc"/>
    <text class="d-stereo" x="980" y="755">UC14</text>
    <text class="d-t" x="980" y="775">Alternar camadas</text>
    <text class="d-t" x="980" y="790">do mapa</text>

    <ellipse cx="980" cy="878" rx="105" ry="36" class="d-uc"/>
    <text class="d-stereo" x="980" y="859">UC15</text>
    <text class="d-t" x="980" y="879">Traçar rota até o</text>
    <text class="d-t" x="980" y="894">estabelecimento</text>

    <ellipse cx="980" cy="1000" rx="105" ry="36" class="d-uc"/>
    <text class="d-stereo" x="980" y="981">UC16</text>
    <text class="d-t" x="980" y="1001">Manter cadastro de</text>
    <text class="d-t" x="980" y="1016">estabelecimentos</text>

    <!-- ===== associações ator ↔ caso de uso ===== -->
    <line class="d-assoc" x1="124" y1="166" x2="325" y2="158"/>
    <line class="d-assoc" x1="124" y1="405" x2="325" y2="400"/>
    <line class="d-assoc" x1="124" y1="686" x2="325" y2="662"/>
    <line class="d-assoc" x1="1276" y1="1000" x2="1085" y2="1000"/>
    <line class="d-assoc" x1="700" y1="1080" x2="700" y2="1036"/>

    <!-- ===== «include» a partir do caso base UC01 ===== -->
    <line class="d-dash" x1="483" y1="369" x2="593" y2="152" marker-end="url(#open)"/>
    <line class="d-dash" x1="508" y1="376" x2="593" y2="256" marker-end="url(#open)"/>
    <line class="d-dash" x1="529" y1="388" x2="593" y2="359" marker-end="url(#open)"/>
    <line class="d-dash" x1="529" y1="412" x2="593" y2="461" marker-end="url(#open)"/>
    <line class="d-dash" x1="508" y1="424" x2="593" y2="564" marker-end="url(#open)"/>
    <line class="d-dash" x1="483" y1="431" x2="593" y2="668" marker-end="url(#open)"/>
    <text class="d-stereo" x="532" y="268">«include»</text>
    <text class="d-stereo" x="551" y="313">«include»</text>
    <text class="d-stereo" x="566" y="366">«include»</text>
    <text class="d-stereo" x="566" y="446">«include»</text>
    <text class="d-stereo" x="551" y="500">«include»</text>
    <text class="d-stereo" x="532" y="545">«include»</text>

    <!-- ===== «include» UC09 → UC10 ===== -->
    <line class="d-dash" x1="700" y1="706" x2="700" y2="962" marker-end="url(#open)"/>
    <text class="d-stereo" x="748" y="838">«include»</text>

    <!-- ===== «extend» (a extensão aponta para o caso base) ===== -->
    <line class="d-dash" x1="881" y1="474" x2="792" y2="548" marker-end="url(#open)"/>
    <text class="d-stereo" x="852" y="500">«extend»</text>

    <line class="d-dash" x1="875" y1="566" x2="807" y2="566" marker-end="url(#open)"/>
    <text class="d-stereo" x="841" y="558">«extend»</text>

    <line class="d-dash" x1="875" y1="670" x2="807" y2="670" marker-end="url(#open)"/>
    <text class="d-stereo" x="841" y="662">«extend»</text>

    <line class="d-dash" x1="881" y1="762" x2="792" y2="690" marker-end="url(#open)"/>
    <text class="d-stereo" x="852" y="744">«extend»</text>

    <polyline class="d-dash" points="1085,878 1140,878 1140,670 1089,670" marker-end="url(#open)"/>
    <text class="d-stereo" x="1140" y="780">«extend»</text>

    <!-- ===== legenda de notação ===== -->
    <g>
      <rect x="24" y="880" width="252" height="248" rx="6" class="d-legend"/>
      <text x="40" y="906" class="d-stereo" text-anchor="start"
            style="letter-spacing:.14em">NOTAÇÃO UML</text>

      <line x1="40" y1="936" x2="86" y2="936" class="d-assoc"/>
      <text x="98" y="940" class="d-t d-t--sm" text-anchor="start">associação</text>

      <line x1="40" y1="968" x2="82" y2="968" class="d-dash" marker-end="url(#open)"/>
      <text x="98" y="972" class="d-t d-t--sm" text-anchor="start">«include» / «extend»</text>

      <line x1="40" y1="1000" x2="79" y2="1000" class="d-gen" marker-end="url(#tri)"/>
      <text x="98" y="1004" class="d-t d-t--sm" text-anchor="start">generalização</text>

      <ellipse cx="60" cy="1034" rx="19" ry="10" class="d-uc d-uc--core"/>
      <text x="98" y="1038" class="d-t d-t--sm" text-anchor="start">caso de uso central</text>

      <ellipse cx="60" cy="1066" rx="19" ry="10" class="d-uc"/>
      <text x="98" y="1070" class="d-t d-t--sm" text-anchor="start">caso de uso de apoio</text>

      <rect x="42" y="1090" width="36" height="20" rx="3" class="d-boundary"/>
      <text x="98" y="1104" class="d-t d-t--sm" text-anchor="start">fronteira do sistema</text>
    </g>
   </svg>
